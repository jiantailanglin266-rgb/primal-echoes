<title>PRIMAL ECHOES icons</title>

<h1>PRIMAL ECHOES / icons.svg</h1>
<div class="grid" id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  document.querySelectorAll('symbol[id^="pe-icon-"]').forEach(sym => {
    const id = sym.id;
    const use = s => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24"><use href="#' + id + '"/></svg>';
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<div class="row">' + use(24) + use(48) + '</div><div class="label">' + id.replace('pe-icon-', '') + '</div>';
    grid.appendChild(cell);
  });
</script>
